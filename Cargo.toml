[package]
name = "portfolio"
version = "0.1.0"
edition = "2021"

[dependencies]
gloo-net = "0.5"
gloo-utils = "0.2.0"
pulldown-cmark = "0.13.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "MouseEvent",
    "Node",
    "PointerEvent",
    "Storage",
    "Window",
] }
yew = { version = "0.23.0", features = ["csr"] }
yew-router = "0.20.0"
